name: Lighthouse Audit

on:
  workflow_dispatch:
    inputs:
      target_url:
        description: 'Website URL to audit'
        required: true
        type: string

jobs:
  lighthouse-audit:
    runs-on: ubuntu-latest
    steps:
      - name: Run Lighthouse
        uses: treosh/lighthouse-ci-action@v11
        with:
          urls: ${{ github.event.inputs.target_url }}
          uploadArtifacts: true
          temporaryPublicStorage: true
