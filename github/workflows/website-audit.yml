name: Website Audit

on:
  workflow_dispatch:
    inputs:
      target_url:
        description: 'Website URL to audit'
        required: true

jobs:
  seo-audit:
    runs-on: ubuntu-latest
    steps:
      - name: Download Screaming Frog
        run: |
          wget https://download.screamingfrog.co.uk/products/seo-spider/screamingfrogseospider_21.0_all.deb
          sudo apt-get update
          sudo apt-get install -y ./screamingfrogseospider_21.0_all.deb

      - name: Run crawl
        run: |
          screamingfrogseospider --crawl ${{ github.event.inputs.target_url }} \
            --headless \
            --save-crawl \
            --output-folder ./report \
            --export-tabs "Internal:All,Response Codes:All"

      - name: Upload report
        uses: actions/upload-artifact@v4
        with:
          name: seo-report
          path: ./report
